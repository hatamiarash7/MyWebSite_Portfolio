<div class="row justify-content-center align-items-center p-4">
  <div class="col-lg-4 col-md-6 text-center m-5">
    <div id="container" class="my-2">
      <div id="dummy"></div>
      <div id="element">
        <img
          src="{{ site.author.image | relative_url }}"
          alt="{{ site.title }}"
          class="circle-image wow animated zoomIn"
          width="500"
          height="500"
          decoding="async"
          fetchpriority="high"
          data-wow-delay=".1s"
        />
      </div>
    </div>
  </div>
</div>
