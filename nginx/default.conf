# Served by nginxinc/nginx-unprivileged behind the Arvancloud CDN, which
# terminates TLS and serves brotli to visitors. This file is included in the
# http context, so maps and log formats are allowed here.
# The image entrypoint substitutes NGINX_PORT into /tmp/default.conf.

# --- Legacy URL redirects -----------------------------------------------------
# The old Jekyll site served /projects/<NN>-<slug>(.html)(/). Normalize those
# variants to one key, then look the key up in redirects.map. Any other path is
# looked up as-is (for example /sitemap.xml).
map $uri $legacy_key {
    "~^(?<legacy_path>/projects/[0-9][0-9]-[a-z0-9-]+?)(\.html|/)?$" $legacy_path;
    default $uri;
}

map $legacy_key $legacy_target {
    default "";
    include /etc/nginx/redirects.map;
    /sitemap.xml /sitemap-index.xml;
}

log_format legacy '$time_iso8601 $status "$request_uri" -> "$legacy_target" '
                  'referer="$http_referer" ua="$http_user_agent" xff="$http_x_forwarded_for"';

server {
    listen ${NGINX_PORT};
    listen [::]:${NGINX_PORT};
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    server_tokens off;
    absolute_redirect off;

    access_log /var/log/nginx/access.log main;
    access_log /var/log/nginx/legacy/legacy-redirects.log legacy if=$legacy_target;

    gzip on;
    gzip_static on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript text/javascript application/json application/manifest+json
               image/svg+xml application/xml text/xml text/plain;

    error_page 404 /404.html;

    # Old Jekyll URLs: permanent redirect, logged to legacy-redirects.log.
    if ($legacy_target) {
        return 301 $legacy_target;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /404.html {
        internal;
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=0, s-maxage=60" always;
    }

    # Content-hashed build output (JS, CSS, fonts, optimized images).
    location ^~ /_astro/ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location ^~ /videos/ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=2592000" always;
        try_files $uri =404;
    }

    # One canonical URL per page: no trailing slash and no .html suffix.
    location ~ ^/index(\.html)?$ {
        return 301 /;
    }

    location ~ ^(?<clean_path>.+)\.html$ {
        return 301 $clean_path$is_args$args;
    }

    location ~ ^(?<clean_path>.+)/$ {
        return 301 $clean_path$is_args$args;
    }

    location ~* \.(?:ico|png|svg|webmanifest|txt|xml)$ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=3600" always;
        try_files $uri =404;
    }

    location / {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=0, s-maxage=300, must-revalidate" always;
        try_files $uri $uri.html $uri/index.html =404;
    }
}
