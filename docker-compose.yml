# Production server. Pull and restart manually:
#   docker compose pull && docker compose up -d
services:
  portfolio:
    image: hatamiarash7/portfolio:latest
    container_name: portfolio
    restart: unless-stopped
    environment:
      NGINX_PORT: ${NGINX_PORT:-8080}
    # Arvancloud connects to this port. Prefix the mapping with "127.0.0.1:"
    # when a reverse proxy on the host sits in front of the container.
    ports:
      - "${NGINX_PORT:-8080}:${NGINX_PORT:-8080}"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - legacy-logs:/var/log/nginx/legacy
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  legacy-logs:
